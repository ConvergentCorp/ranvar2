[project]
name = "ranvar2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.3.0",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    # cfunc compiles generated modules at runtime, which needs a build toolchain
    # present rather than only during the project's own build.
    "setuptools>=77",
]

[build-system]
requires = ["setuptools>=77", "cython>=3.3.0", "numpy>=2.5.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ranvar2"]
