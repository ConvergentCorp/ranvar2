[project]
name = "ranvar2"
version = "0.2.0"
description = "Fast probabilistic modelling: t-digest random variables and Monte Carlo models compiled with Cython"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adolph Vogel", email = "ajvogel@gmail.com" }]
keywords = ["monte-carlo", "probability", "statistics", "t-digest", "cython", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
]
dependencies = [
    "cython>=3.3.0",
    "numpy>=2.5.2",
    # cfunc compiles generated modules at runtime, which needs a build toolchain
    # present rather than only during the project's own build.
    "setuptools>=77",
]

[project.urls]
Homepage = "https://github.com/ConvergentCorp/ranvar2"
Repository = "https://github.com/ConvergentCorp/ranvar2"
Issues = "https://github.com/ConvergentCorp/ranvar2/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=77", "cython>=3.3.0", "numpy>=2.5.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ranvar2"]

# cfunc compiles each model at runtime against ranvar2.ranvar, which means the
# .pxd has to travel with the installed package: without it a model compiled in
# a downstream project fails with "'ranvar2/ranvar.pxd' not found".
[tool.setuptools.package-data]
ranvar2 = ["*.pxd"]
